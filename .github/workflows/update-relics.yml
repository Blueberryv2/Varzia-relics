name: Run Relic Checks

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run checks
        run: node run-checks.js

      - name: Save changed files back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add varzia-relics.json newest-relics.json relic-pricing.json categories.json
          git diff --staged --quiet || git commit -m "Update relic data"
          git push
