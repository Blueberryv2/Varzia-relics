<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Serif+Text:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
  <title>Varzia's Relics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Varzia's Relics</h1>
  <p id="meta">Loading...</p>
  <div class="divider"> ───────────────────────────────────────────── ✧ ───────────────────────────────────────────── </div>
  <div id="relics">Loading relic data...</div>

  <script>

    function nextUpdateTime() {
      const updateHours = [0, 6, 12, 18];
      const now = new Date();
      for (const h of updateHours) {
        const candidate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), h, 0, 0));
        if (candidate > now) return candidate;
      }
      return new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1, updateHours[0], 0, 0));
    }

    function formatCountdown(ms) {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      return h + "h " + m + "m " + s + "s";
    }

    function updateCountdown() {
      const meta = document.getElementById("meta");
      const next = nextUpdateTime();
      const diff = next - new Date();
      meta.textContent = "Updates every 6 hours 00:00, 06:00, 12:00, 18:00 UTC - next update in " + formatCountdown(diff);
    }

    async function loadRelics() {
      const out = document.getElementById("relics");
      try {
        const r = await fetch("relics.json");
        const data = await r.json();

        out.innerHTML = "";
        data.relics.forEach(relic => {
          const card = document.createElement("div");
          card.className = "relic-card";

          const header = document.createElement("div");
          header.className = "relic-header";

          const img = document.createElement("img");
          img.src = relic.icon;
          img.alt = relic.relic;
          img.className = "relic-icon";
          header.appendChild(img);

          const textBox = document.createElement("div");

          const title = document.createElement("h2");
          title.textContent = relic.relic;

          const subtitle = document.createElement("h2");
          subtitle.className = "relic-value";
          const valueSpan = document.createElement("span");
          valueSpan.textContent = "[" + relic.relicValue + "p avg] ";
          valueSpan.className =
            relic.relicValue < 13 ? "value-low" :
            relic.relicValue < 15 ? "value-mid" :
            "value-high";

          subtitle.appendChild(valueSpan);
          const labelSpan = document.createElement("span");
          labelSpan.textContent = "Best of 4, Radiant";
          labelSpan.className = "best-of-4-label";
          subtitle.appendChild(labelSpan);

          textBox.appendChild(title);
          textBox.appendChild(subtitle);
          header.appendChild(textBox);

          card.appendChild(header);

            relic.items.forEach(x => {
            const line = document.createElement("p");
            line.className = "item-row";

            const nameSpan = document.createElement("span");
            nameSpan.textContent = x.itemName;

            const priceSpan = document.createElement("span");
            priceSpan.textContent = x.priceKnown ? x.price + "p" : "no online sellers";

            line.appendChild(nameSpan);
            line.appendChild(priceSpan);
            card.appendChild(line);
          });

                    // Squad buttons + overlay box
          const squadRow = document.createElement("div");
          squadRow.className = "squad-row";

          const findBtn = document.createElement("button");
          findBtn.className = "squad-btn find-squad-btn";
          findBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M8 4H6a2 2
          0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M16 4h2a2 2 0 0 1 2 2v4"/><path d="M21 14H11"/><path d="m15 10-4 4 4 4"/></svg>` + " Find Squad";

          const hostBtn = document.createElement("button");
          hostBtn.className = "squad-btn host-squad-btn";
          hostBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2
          2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M16 4h2a2 2 0 0 1 2 2v4"/><path d="M21 14H11"/><path d="m15 10-4 4 4 4"/></svg>` + " Host Squad";

          squadRow.appendChild(findBtn);
          squadRow.appendChild(hostBtn);

          const overlay = document.createElement("div");
          overlay.className = "squad-overlay";
          overlay.style.display = "none";

          const textInput = document.createElement("input");
          textInput.type = "text";
          textInput.className = "squad-text";
          textInput.readOnly = true;

          const closeBtn = document.createElement("button");
          closeBtn.className = "squad-close-btn";
          closeBtn.textContent = "Close";

          overlay.appendChild(textInput);
          overlay.appendChild(closeBtn);

          function openSquadBox(prefix) {
            textInput.value = prefix + " [" + relic.relic + " Relic] Rad";
            overlay.style.display = "flex";
            textInput.focus();
            textInput.select();
          }

          findBtn.addEventListener("click", () => openSquadBox("LF"));
          hostBtn.addEventListener("click", () => openSquadBox("H"));
          closeBtn.addEventListener("click", () => {
            overlay.style.display = "none";
          });

          card.style.position = "relative";
          card.appendChild(squadRow);
          card.appendChild(overlay);

        out.appendChild(card);
        });
      } catch (e) {
        out.textContent = "Failed to load relic data: " + e;
      }
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
    loadRelics();
  </script>
</body>
</html>
